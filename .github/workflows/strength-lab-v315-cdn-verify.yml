name: Verify Strength Lab 3.1.5 CDN

on:
  push:
    branches:
      - strength-lab-v3.1.5
    paths:
      - .github/workflows/strength-lab-v315-cdn-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strength-lab-v3.1.5

      - name: Verify immutable tag assets through both public origins
        shell: bash
        run: |
          set -euo pipefail
          primary='https://cdn.jsdelivr.net/gh/Chriswelch3254/website-files@strength-lab-v3.1.5/assets/strength-lab-v3/releases/3.1.5/strength-lab-v3.1.5-4b6761503bc2.js'
          fallback='https://raw.githubusercontent.com/Chriswelch3254/website-files/strength-lab-v3.1.5/assets/strength-lab-v3/releases/3.1.5/strength-lab-v3.1.5-4b6761503bc2.js'

          curl --fail --location --retry 5 --retry-all-errors --compressed \
            --dump-header /tmp/primary.headers "$primary" --output /tmp/primary.js
          curl --fail --location --retry 5 --retry-all-errors --compressed \
            --dump-header /tmp/fallback.headers "$fallback" --output /tmp/fallback.js

          for file in /tmp/primary.js /tmp/fallback.js; do
            test "$(wc -c < "$file")" = '1237911'
            printf '%s  %s\n' \
              '4b6761503bc214f560b3549bd80ff64355d79230424fe9c1e371a2ffb386fb23' \
              "$file" | sha256sum --check --strict
          done

          cmp --silent /tmp/primary.js /tmp/fallback.js
          grep -Eiq '^content-type:.*(javascript|text/plain)' /tmp/primary.headers
          grep -Eiq '^cache-control:.*(immutable|max-age=31536000)' /tmp/primary.headers

          mkdir -p assets/strength-lab-v3/releases/3.1.5
          {
            printf 'STRENGTH_LAB_V3_1_5_CDN_VERIFIED\n'
            printf 'runtime_bytes=1237911\n'
            printf 'runtime_sha256=4b6761503bc214f560b3549bd80ff64355d79230424fe9c1e371a2ffb386fb23\n'
            printf 'primary_cache_control='
            grep -Ei '^cache-control:' /tmp/primary.headers | tail -n 1 | tr -d '\r' | cut -d' ' -f2-
          } > assets/strength-lab-v3/releases/3.1.5/CDN_VERIFY_OK.txt

      - name: Commit CDN verification receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/strength-lab-v3/releases/3.1.5/CDN_VERIFY_OK.txt
          git commit -m 'ci: record Strength Lab 3.1.5 CDN verification'
          git push origin HEAD:strength-lab-v3.1.5
