name: Freeze Strength Lab 3.1.5 Compatible Stylesheet

on:
  push:
    branches:
      - strength-lab-v3.1.5
    paths:
      - .github/workflows/strength-lab-v315-css-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strength-lab-v3.1.5
          fetch-depth: 0

      - name: Capture current production-compatible Strength Lab stylesheet
        shell: bash
        run: |
          set -euo pipefail
          release_dir='assets/strength-lab-v3/releases/3.1.5'
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --compressed \
            'https://www.neuform-fitness.com/tools-strength-lab' \
            --output /tmp/strength-lab-live.html

          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json

          html = Path('/tmp/strength-lab-live.html').read_text(encoding='utf-8')
          match = re.search(
              r'<style>\s*(/\* NeuForm Strength Lab v3 release styles\..*?)</style>',
              html,
              flags=re.S,
          )
          if not match:
              raise SystemExit('strength_lab_style_block_not_found')

          css = match.group(1).strip() + '\n'
          required = [
              '.nfsl-v3-root',
              '.nfsl-v3-shell',
              '.nfsl-v3-welcome',
              '.nfsl-v3-nav',
              '@media (max-width: 560px)',
          ]
          missing = [token for token in required if token not in css]
          if missing:
              raise SystemExit('missing_required_css_tokens:' + ','.join(missing))

          out = Path('assets/strength-lab-v3/releases/3.1.5/strength-lab-v3.1.5-compat.css')
          out.write_text(css, encoding='utf-8', newline='\n')
          data = out.read_bytes()
          receipt = {
              'productVersion': '3.1.5',
              'source': 'current production-compatible Strength Lab stylesheet snapshot',
              'path': out.name,
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
          }
          Path('assets/strength-lab-v3/releases/3.1.5/stylesheet-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          printf 'STRENGTH_LAB_V3_1_5_STYLESHEET_FROZEN\n' \
            > "$release_dir/STYLESHEET_FREEZE_OK.txt"

      - name: Commit stylesheet and create complete asset tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/strength-lab-v3/releases/3.1.5
          git commit -m 'release: freeze Strength Lab 3.1.5 compatible stylesheet'
          git push origin HEAD:strength-lab-v3.1.5

          git tag -a strength-lab-v3.1.5-assets -m 'NeuForm Strength Lab 3.1.5 complete boot assets'
          git push origin refs/tags/strength-lab-v3.1.5-assets
